name: Publicar no GitHub Pages

# Publica o site a cada push na branch principal.
# Requer: Settings > Pages > Source = "GitHub Actions"
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      # Site estático: publica o repositório inteiro, sem etapa de build.
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
